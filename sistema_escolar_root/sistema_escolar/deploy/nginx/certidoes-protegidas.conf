# Inclua estas duas locations dentro do bloco `server {}` da aplicação.
# A rota autenticada /certidao/visualizarPdf/{id} continua funcionando,
# porque somente o acesso estático direto à pasta de uploads é bloqueado.

location = /uploads/certidoes {
    return 404;
}

location ^~ /uploads/certidoes/ {
    return 404;
}
